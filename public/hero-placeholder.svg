<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#002f6c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69b3e7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroGrad)"/>

  <!-- Overlay Pattern -->
  <rect width="1920" height="1080" fill="url(#heroGrad)" opacity="0.8"/>

  <!-- Central Logo Area -->
  <circle cx="960" cy="540" r="150" fill="rgba(255,255,255,0.9)" stroke="#002f6c" stroke-width="6"/>
  <circle cx="960" cy="540" r="120" fill="#002f6c"/>

  <!-- Greek Letters -->
  <text x="960" y="570" text-anchor="middle" font-family="serif" font-size="72" font-weight="bold" fill="white">ΒΘΠ</text>

  <!-- Chapter Name -->
  <text x="960" y="420" text-anchor="middle" font-family="serif" font-size="36" font-weight="bold" fill="white">BETA UPSILON CHAPTER</text>
  <text x="960" y="720" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="500" fill="white">BETA THETA PI</text>

  <!-- Decorative Elements -->
  <rect x="400" y="200" width="200" height="4" fill="rgba(255,255,255,0.6)" rx="2"/>
  <rect x="1320" y="200" width="200" height="4" fill="rgba(255,255,255,0.6)" rx="2"/>
  <rect x="400" y="880" width="200" height="4" fill="rgba(255,255,255,0.6)" rx="2"/>
  <rect x="1320" y="880" width="200" height="4" fill="rgba(255,255,255,0.6)" rx="2"/>

  <!-- Corner Elements -->
  <polygon points="100,100 200,100 150,150" fill="rgba(255,255,255,0.3)"/>
  <polygon points="1820,100 1720,100 1770,150" fill="rgba(255,255,255,0.3)"/>
  <polygon points="100,980 200,980 150,930" fill="rgba(255,255,255,0.3)"/>
  <polygon points="1820,980 1720,980 1770,930" fill="rgba(255,255,255,0.3)"/>
</svg>
